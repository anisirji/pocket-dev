<!doctype html><meta charset="utf-8"><style>

<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4c8dff"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c6b86"/></marker></defs><rect width="1200" height="520" fill="#0b0f17"/><text x="40" y="52" class="h">Joining a room</text>
<rect x="40" y="90" width="360" height="270" rx="16" class="c"/><text x="60" y="128" class="t">New device</text><text x="60" y="158" class="s">Settings, Room, Join a room</text>
<text x="60" y="200" class="acc">Give it the invite any of three ways</text>
<text x="60" y="232" class="s">1  type or paste the code  ABCD-EFGH</text><text x="60" y="260" class="s">2  scan the QR with the camera</text><text x="60" y="288" class="s">3  choose a photo of the QR</text>
<text x="60" y="330" class="s">then pick Admin or Collaborator</text>
<rect x="800" y="90" width="360" height="270" rx="16" class="a"/><text x="820" y="128" class="t">Host</text><text x="820" y="158" class="s">Settings, Room, Add a device</text>
<text x="820" y="200" class="acc">Shows a one-use code + QR</text><text x="820" y="232" class="s">valid 10 minutes, limited guesses</text><text x="820" y="260" class="s">checks the code, adds the member</text><text x="820" y="288" class="s">and its secret to the room</text>
<path d="M400 190 L800 190" class="l" marker-end="url(#ar)"/><text x="600" y="178" text-anchor="middle" class="t" style="font-size:17px">1  code, name, own address</text>
<path d="M800 250 L400 250" class="l" marker-end="url(#ar)"/><text x="600" y="240" text-anchor="middle" class="t" style="font-size:17px">2  accepted, host secret</text>
<path d="M400 310 L800 310" class="d" marker-end="url(#ag)"/><text x="600" y="336" text-anchor="middle" class="s">3  host calls back to check it</text><text x="600" y="356" text-anchor="middle" class="s">with the new member's secret</text>
<rect x="440" y="400" width="320" height="70" rx="14" fill="#10261d" stroke="#4cc38a" stroke-width="2"/><text x="600" y="430" text-anchor="middle" class="t">Both online in the room</text><text x="600" y="454" text-anchor="middle" class="s">Work on switcher lists both</text>
<text x="40" y="500" class="s" style="font-size:13px">A used or expired code is refused. After the swap, each side holds a secret for the other and sends it with every room request.</text></svg>
