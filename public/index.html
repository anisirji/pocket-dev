<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0e14">
<title>Pocket Dev</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10/lib/addon-fit.js"></script>
<link rel="stylesheet" href="/git.css">
<script type="module" src="/git.js"></script>
<link rel="stylesheet" href="/history.css">
<link rel="stylesheet" href="/settings.css">
<style>
  :root {
    --bg: #0b0e14; --panel: #131823; --panel-2: #1b2130; --line: #252d3c;
    --text: #d7dce5; --muted: #7d8799; --accent: #6aa9ff; --danger: #ff7b72;
    --mono: ui-monospace, "SF Mono", Menlo, "Roboto Mono", "Droid Sans Mono", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--text); font: 14px/1.3 system-ui, -apple-system, Roboto, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input { font: inherit; }

  #app { position: fixed; top: 0; left: 0; right: 0; height: 100dvh; display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 6px; padding: 6px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #tabs { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; display: flex; align-items: center; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
  .tab.active { border-color: var(--accent); background: var(--panel-2); }
  .tab.exited .tab-label { color: var(--muted); }
  .tab-label { height: 34px; padding: 0 2px 0 10px; max-width: 190px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab-x { width: 30px; height: 34px; color: var(--muted); font-size: 12px; }
  .icon-btn { flex: none; height: 36px; min-width: 36px; padding: 0 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
  #new { font-size: 20px; line-height: 1; padding: 0; }
  #portsBtn.open { border-color: var(--accent); }
  #portsCount { display: inline-block; min-width: 18px; margin-left: 4px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #08101e; font-size: 12px; font-weight: 600; }
  #portsCount:empty { display: none; }

  #ports { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #ports[hidden] { display: none; }
  #portForm { display: flex; gap: 6px; }
  #portInput { width: 92px; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); outline: none; }
  #portInput:focus { border-color: var(--accent); }
  .primary { height: 34px; padding: 0 14px; border-radius: 8px; background: var(--accent); color: #08101e; font-weight: 600; }
  .chip { display: flex; align-items: center; border-radius: 17px; background: var(--panel-2); border: 1px solid var(--line); }
  .chip a { padding: 0 4px 0 12px; line-height: 32px; color: var(--accent); text-decoration: none; font-family: var(--mono); }
  .chip button { width: 30px; height: 32px; color: var(--muted); font-size: 12px; }
  .chip-off { padding: 0 4px 0 12px; line-height: 32px; color: var(--muted); font-family: var(--mono); }
  .chip-off.error { color: var(--danger); }
  #portErr { flex-basis: 100%; margin: 0; color: var(--danger); font-size: 13px; }
  #portErr:empty { display: none; }

  #terms { position: relative; flex: 1; min-height: 0; }
  .term { position: absolute; inset: 0; visibility: hidden; }
  .term.active { visibility: visible; }
  .term .xterm { height: 100%; padding: 4px 0 0 6px; }
  #latest { position: absolute; right: 14px; bottom: 12px; z-index: 5; height: 34px; padding: 0 14px; border-radius: 17px; background: var(--accent); color: #08101e; font-weight: 600; box-shadow: 0 2px 10px #0008; }
  #badge { position: absolute; top: 8px; right: 10px; z-index: 5; padding: 3px 9px; border-radius: 10px; background: #3a2a10; color: #f0c674; font-size: 12px; }
  [hidden] { display: none !important; }

  #inputBar { display: flex; gap: 6px; padding: 6px; border-top: 1px solid var(--line); background: var(--panel); }
  #cmd { flex: 1; min-width: 0; height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 16px; outline: none; }
  #cmd:focus { border-color: var(--accent); }
  #attach { flex: none; width: 42px; height: 42px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); font-size: 18px; }
  #attach:active { background: var(--line); }
  #uploadStatus { position: absolute; left: 10px; bottom: 12px; z-index: 5; max-width: calc(100% - 130px); padding: 8px 12px; border-radius: 17px; background: var(--panel-2); border: 1px solid var(--line); box-shadow: 0 2px 10px #0008; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #uploadStatus.error { color: var(--danger); white-space: normal; }
  #send { height: 42px; padding: 0 16px; border-radius: 10px; background: var(--accent); color: #08101e; font-weight: 600; }

  #keys { display: flex; gap: 6px; padding: 0 6px 6px; overflow-x: auto; background: var(--panel); scrollbar-width: none; }
  #keys::-webkit-scrollbar { display: none; }
  .key { flex: none; min-width: 52px; height: 42px; padding: 0 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); font-family: var(--mono); font-size: 13px; }
  .key:active, .icon-btn:active { background: var(--line); }

  .layer { position: absolute; inset: 0; z-index: 20; }
  #sheet { display: flex; flex-direction: column; justify-content: flex-end; background: #000a; }
  #sheetPanel { display: flex; flex-direction: column; max-height: 80%; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; background: var(--panel); }
  .layer-head { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 6px 8px 14px; }
  .layer-head h2 { flex: 1; margin: 0; font-size: 15px; font-weight: 600; }
  #sheetBody { overflow-y: auto; overscroll-behavior: contain; padding: 0 6px; }
  #sheetFoot { flex: none; padding: 0 6px 10px; }
  .sheet-label { margin: 12px 10px 2px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .row { display: flex; align-items: center; gap: 2px; }
  .row-main { flex: 1; min-width: 0; min-height: 48px; padding: 5px 10px; border-radius: 10px; text-align: left; }
  .row-main:active, .row-btn:active { background: var(--panel-2); }
  .row-name, .row-path { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-path { margin-top: 1px; color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .row-btn { flex: none; width: 42px; height: 42px; border-radius: 10px; color: var(--muted); font-size: 18px; }
  .row-btn.on { color: #f0c674; }
  .row-btn:disabled { opacity: .3; }
  .sheet-form { display: flex; gap: 6px; padding: 10px 4px 0; }
  .sheet-form input { flex: 1; min-width: 0; height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 16px; outline: none; }
  .sheet-form input:focus { border-color: var(--accent); }
  .sheet-form .primary { height: 42px; border-radius: 10px; }
  .sheet-note { margin: 10px 10px 0; color: var(--muted); font-size: 13px; }
  .sheet-note:empty { display: none; }
  .sheet-note.error { color: var(--danger); }
  .sheet-act { height: 36px; padding: 0 14px; border-radius: 8px; color: var(--accent); font-weight: 600; }
  .row-main.cmd, .row-text { font-family: var(--mono); font-size: 14px; }
  .row-text { flex: 1; min-width: 0; padding: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.editing { min-height: 48px; }
  #textView { display: flex; flex-direction: column; background: var(--bg); }
  #textView .layer-head { border-bottom: 1px solid var(--line); background: var(--panel); }
  #textTitle.ok { color: #7ee787; }
  #textTitle.error { color: #f0c674; }
  #textPre { flex: 1; min-height: 0; margin: 0; padding: 8px 10px 16px; overflow: auto; overscroll-behavior: contain; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
  .key.icon { min-width: 44px; padding: 0; font-family: inherit; font-size: 17px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="viewSwitch" role="group" aria-label="View">
      <button data-view="terminal">Terminal</button><button data-view="git">Git</button>
    </div>
    <div id="tabs"></div>
    <button id="new" class="icon-btn" aria-label="New terminal">+</button>
    <button id="resumeBtn" class="icon-btn" aria-label="Resume a laptop conversation"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:auto"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button>
    <button id="portsBtn" class="icon-btn">Ports<span id="portsCount"></span></button>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙︎</button>
  </header>
  <div id="ports" hidden>
    <form id="portForm">
      <input id="portInput" type="number" inputmode="numeric" min="1" max="65535" placeholder="3000" enterkeyhint="go" aria-label="Port">
      <button class="primary">Open</button>
    </form>
    <div id="chips" style="display:contents"></div>
    <p id="portErr"></p>
  </div>
  <main id="terms">
    <div id="badge" hidden></div>
    <button id="latest" hidden>↓ latest</button>
    <button id="uploadStatus" hidden></button>
  </main>
  <form id="inputBar">
    <button id="attach" type="button" aria-label="Attach a file">📎</button>
    <input id="file" type="file" accept="image/*,*/*" multiple hidden>
    <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="Type a command">
    <button id="send">Send</button>
  </form>
  <div id="keys"></div>
  <div id="textView" class="layer" hidden>
    <div class="layer-head"><h2 id="textTitle"></h2><button id="copyAll" class="primary">Copy all</button><button id="textClose" class="icon-btn">Close</button></div>
    <pre id="textPre"></pre>
  </div>
  <div id="sheet" class="layer" hidden>
    <section id="sheetPanel">
      <div class="layer-head"><h2 id="sheetTitle"></h2><span id="sheetAction"></span><button id="sheetClose" class="icon-btn" aria-label="Close">✕</button></div>
      <div id="sheetBody"></div>
      <div id="sheetFoot"><div id="sheetFormSlot"></div><p id="sheetNote" class="sheet-note"></p></div>
    </section>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const h = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
};

const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch {} },
};

// The one request helper for every page script: the server refuses changes without x-pocket-dev (see server.js).
async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: { 'x-pocket-dev': '1', ...(body ? { 'content-type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) {
    location.replace('/login.html');
    throw new Error('Not logged in');
  }
  const data = res.status === 204 ? null : await res.json();
  if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);
  return data;
}

const views = new Map();
let activeId = null;
const active = () => views.get(activeId);

const THEME = {
  background: '#0b0e14', foreground: '#d7dce5', cursor: '#6aa9ff', selectionBackground: '#2a3550',
  black: '#1b2130', red: '#ff7b72', green: '#7ee787', yellow: '#f0c674', blue: '#6aa9ff', magenta: '#d2a8ff', cyan: '#76e3ea', white: '#d7dce5',
  brightBlack: '#5c6577', brightRed: '#ffa198', brightGreen: '#a5f0b0', brightYellow: '#f5d896', brightBlue: '#9cc6ff', brightMagenta: '#e2c5ff', brightCyan: '#a2eef2', brightWhite: '#ffffff',
};

function sendMsg(view, msg) {
  if (view.ws?.readyState === WebSocket.OPEN) view.ws.send(JSON.stringify(msg));
}
const sendInput = (view, d) => sendMsg(view, { t: 'in', d });

function makeView(session) {
  const el = h('div', 'term');
  $('terms').appendChild(el);
  const term = new Terminal({
    fontSize: 13, scrollback: 5000, cursorBlink: true, theme: THEME,
    fontFamily: getComputedStyle(document.documentElement).getPropertyValue('--mono'),
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(el);
  const view = { id: session.id, title: session.title, exitCode: session.exitCode, term, fit, el, ws: null, online: false, everOnline: false, retry: 0, closed: false };
  term.onData((d) => sendInput(view, d));
  term.onResize(({ cols, rows }) => sendMsg(view, { t: 'resize', cols, rows }));
  term.onScroll(() => view.id === activeId && renderLatest());
  term.onWriteParsed(() => view.id === activeId && renderLatest());
  attachTouchScroll(view);
  views.set(view.id, view);
  fitView(view);
  connect(view);
  return view;
}

function connect(view) {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/${view.id}`);
  view.ws = ws;
  ws.onopen = () => {
    view.online = view.everOnline = true;
    view.term.reset();
    if (terminalShown()) sendMsg(view, { t: 'resize', cols: view.term.cols, rows: view.term.rows });
    renderBadge();
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.t === 'out') view.term.write(msg.d);
    else if (msg.t === 'exit') {
      view.exitCode = msg.code;
      view.term.write(`\r\n\x1b[2m[process exited ${msg.code}]\x1b[0m\r\n`);
      renderTabs();
    }
  };
  ws.onclose = () => {
    if (view.ws !== ws || view.closed) return;
    view.online = false;
    renderBadge();
    clearTimeout(view.retry);
    view.retry = setTimeout(reconnect, 2000, view);
  };
}

// Syncing first drops views whose session is gone and redirects to login if the cookie died,
// neither of which a failed WebSocket handshake can report.
async function reconnect(view) {
  try { await syncSessions(); } catch {}
  if (views.get(view.id) !== view) return;
  if (view.ws?.readyState === WebSocket.OPEN || view.ws?.readyState === WebSocket.CONNECTING) return;
  connect(view);
}

function dropView(view) {
  view.closed = true;
  clearTimeout(view.retry);
  view.ws?.close();
  view.term.dispose();
  view.el.remove();
  views.delete(view.id);
}

async function syncSessions() {
  const list = await api('GET', '/api/sessions');
  const ids = new Set(list.map((s) => s.id));
  for (const view of [...views.values()]) if (!ids.has(view.id)) dropView(view);
  for (const s of list) {
    const view = views.get(s.id);
    if (view) view.exitCode = s.exitCode ?? view.exitCode;
    else makeView(s);
  }
  if (!views.has(activeId) && views.size) activate(views.keys().next().value);
  renderTabs();
}

async function newSession(cwd) {
  const s = await api('POST', '/api/sessions', cwd ? { cwd } : {});
  activate(makeView(s).id);
}

async function closeSession(view) {
  if (!confirm(`Close ${view.title}? Anything running in it will be killed.`)) return;
  try { await api('DELETE', `/api/sessions/${view.id}`); } catch {}
  const wasActive = view.id === activeId;
  dropView(view);
  if (!views.size) return newSession();
  if (wasActive) activate(views.keys().next().value);
  else renderTabs();
}

function activate(id) {
  activeId = id;
  store.set('pd.active', id);
  for (const v of views.values()) v.el.classList.toggle('active', v.id === id);
  renderTabs();
  renderBadge();
  renderLatest();
  const view = active();
  if (view) fitView(view);
  $('tabs').querySelector('.tab.active')?.scrollIntoView({ inline: 'nearest', block: 'nearest' });
}

function renderTabs() {
  $('tabs').replaceChildren(...[...views.values()].map((v) => {
    const exited = v.exitCode !== null;
    const tab = h('div', `tab${v.id === activeId ? ' active' : ''}${exited ? ' exited' : ''}`);
    const label = h('button', 'tab-label', exited ? `${v.title} [process exited ${v.exitCode}]` : v.title);
    label.onclick = () => activate(v.id);
    const close = h('button', 'tab-x', '✕');
    close.setAttribute('aria-label', `Close ${v.title}`);
    close.onclick = () => closeSession(v);
    tab.append(label, close);
    return tab;
  }));
}

function renderBadge() {
  const view = active();
  $('badge').hidden = !view || view.online;
  if (view) $('badge').textContent = view.everOnline ? 'reconnecting…' : 'connecting…';
}

function renderLatest() {
  const buf = active()?.term.buffer.active;
  $('latest').hidden = !buf || buf.viewportY >= buf.baseY;
}

const terminalShown = () => $('app').dataset.view !== 'git';

function fitView(view) {
  // A hidden page or the Git view lays terminals out at a bogus size, which would be pushed to the shared shell.
  if (document.hidden || !terminalShown()) return;
  try { view.fit.fit(); } catch {}
}

let fitFrame = 0;
function scheduleFit() {
  cancelAnimationFrame(fitFrame);
  fitFrame = requestAnimationFrame(() => {
    for (const v of views.values()) fitView(v);
    renderLatest();
  });
}

// xterm 5's own touch scrolling is unreliable on Android, so drive scrollLines from touch deltas with a small fling.
function attachTouchScroll(view) {
  let lastY = 0, lastT = 0, velocity = 0, carry = 0, dragging = false, frame = 0;
  const rowPx = () => (view.el.querySelector('.xterm-screen')?.clientHeight || 0) / view.term.rows || 16;
  const scrollPx = (dy) => {
    carry += dy;
    const lines = Math.trunc(carry / rowPx());
    if (lines) {
      view.term.scrollLines(lines);
      carry -= lines * rowPx();
    }
  };
  view.el.addEventListener('touchstart', (e) => {
    cancelAnimationFrame(frame);
    if (e.touches.length !== 1) return;
    lastY = e.touches[0].clientY;
    lastT = e.timeStamp;
    velocity = carry = 0;
    dragging = false;
  }, { passive: true });
  view.el.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 1) return;
    const y = e.touches[0].clientY;
    const dy = lastY - y;
    if (!dragging && Math.abs(dy) < 6) return;
    dragging = true;
    e.preventDefault();
    e.stopPropagation();
    velocity = dy / Math.max(1, e.timeStamp - lastT);
    lastY = y;
    lastT = e.timeStamp;
    scrollPx(dy);
  }, { passive: false, capture: true });
  view.el.addEventListener('touchend', (e) => {
    if (!dragging || e.timeStamp - lastT > 100) return;
    let perFrame = velocity * 16;
    const step = () => {
      perFrame *= 0.95;
      if (Math.abs(perFrame) < 0.5) return;
      scrollPx(perFrame);
      frame = requestAnimationFrame(step);
    };
    frame = requestAnimationFrame(step);
  }, { passive: true });
}

const KEYS = [
  ['Ctrl+C', '\x03'], ['Enter', '\r'], ['Esc', '\x1b'], ['Tab', '\t'],
  ['↑', 'A'], ['↓', 'B'], ['←', 'D'], ['→', 'C'], ['Ctrl+D', '\x04'],
];
const ARROWS = 'ABCD';

const closeKeyboard = () => document.activeElement?.blur();

// Buttons that take focus would close the phone keyboard, so swallow the press and act on click.
function keepFocus(button) {
  button.tabIndex = -1;
  button.addEventListener('pointerdown', (e) => e.preventDefault());
  button.addEventListener('mousedown', (e) => e.preventDefault());
}

function iconKey(label, ariaLabel, onClick) {
  const key = h('button', 'key icon', label);
  key.setAttribute('aria-label', ariaLabel);
  keepFocus(key);
  key.onclick = onClick;
  $('keys').appendChild(key);
}
iconKey('⚡', 'Shortcuts', () => openShortcuts());
iconKey('📋', 'Copy output', () => openText());

for (const [label, seq] of KEYS) {
  const key = h('button', 'key', label);
  keepFocus(key);
  key.onclick = () => {
    const view = active();
    if (!view) return;
    // Match what xterm sends for a real arrow key: SS3 form when the app enabled application cursor mode.
    const data = ARROWS.includes(seq) ? (view.term.modes.applicationCursorKeysMode ? '\x1bO' : '\x1b[') + seq : seq;
    sendInput(view, data);
    if (seq === '\r') closeKeyboard();
  };
  $('keys').appendChild(key);
}

function runCommand(view, text) {
  if (text) {
    sendInput(view, text);
    // A TUI that detects pastes by chunk can read text+CR arriving together as a pasted newline, not a submit.
    setTimeout(sendInput, 30, view, '\r');
  } else {
    sendInput(view, '\r');
  }
  view.term.scrollToBottom();
  closeKeyboard();
}

keepFocus($('send'));
$('inputBar').addEventListener('submit', (e) => {
  e.preventDefault();
  const view = active();
  if (!view) return;
  const text = $('cmd').value;
  $('cmd').value = '';
  runCommand(view, text);
});

$('latest').addEventListener('click', () => {
  active()?.term.scrollToBottom();
  renderLatest();
});
keepFocus($('latest'));

// One layer at a time; each pushes a history entry so Android's back gesture closes it instead of leaving the page.
let layer = null;
function showLayer(name) {
  closeKeyboard();
  if (!layer) history.pushState({ layer: true }, '');
  layer = name;
  renderLayer();
}
function hideLayer() {
  if (!layer) return;
  layer = null;
  renderLayer();
  if (history.state?.layer) history.back();
}
window.addEventListener('popstate', () => {
  layer = null;
  renderLayer();
});
const SHEETS = { folders: renderFolders, shortcuts: renderShortcuts };
function renderLayer() {
  $('sheet').hidden = !SHEETS[layer];
  $('textView').hidden = layer !== 'text';
  SHEETS[layer]?.();
}
function setSheet({ title, action, rows = [], form, note = '', error = false }) {
  $('sheetTitle').textContent = title;
  $('sheetAction').replaceChildren(...(action ? [action] : []));
  $('sheetBody').replaceChildren(...rows);
  // Re-inserting the form would blur its input and drop the phone keyboard after every add.
  if ($('sheetFormSlot').firstChild !== form) $('sheetFormSlot').replaceChildren(...(form ? [form] : []));
  $('sheetNote').textContent = note;
  $('sheetNote').classList.toggle('error', error);
}
$('sheetClose').addEventListener('click', hideLayer);
$('sheet').addEventListener('click', (e) => e.target === $('sheet') && hideLayer());

function sheetForm(placeholder, buttonLabel, onSubmit) {
  const form = h('form', 'sheet-form');
  const input = h('input');
  Object.assign(input, { type: 'text', placeholder, autocomplete: 'off', autocapitalize: 'off', spellcheck: false, enterKeyHint: 'go' });
  input.setAttribute('autocorrect', 'off');
  form.append(input, h('button', 'primary', buttonLabel));
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (input.value.trim()) onSubmit(input.value.trim(), input);
  });
  return form;
}

let folders = null;
let folderNote = '';
const otherPath = sheetForm('Other path, e.g. ~/app', 'Open', (value) => openFolder(value));

async function openFolders() {
  folderNote = '';
  showLayer('folders');
  try { folders = await api('GET', '/api/folders'); } catch (err) { folderNote = err.message; }
  if (layer === 'folders') renderFolders();
}

async function openFolder(dir) {
  try {
    await newSession(dir);
    otherPath.querySelector('input').value = '';
    hideLayer();
  } catch (err) {
    folderNote = err.message;
    renderFolders();
  }
}

async function togglePin(dir, pinned) {
  try { folders = await api('PUT', '/api/folders/pinned', { path: dir, pinned }); } catch (err) { folderNote = err.message; }
  renderFolders();
}

function renderFolders() {
  if (!folders) return setSheet({ title: 'New terminal', note: folderNote || 'Loading…', error: !!folderNote });
  const { home, pinned, recent, projects } = folders;
  const tilde = (p) => (p === home ? '~' : p.startsWith(`${home}/`) ? `~${p.slice(home.length)}` : p);
  const pinnedPaths = new Set(pinned.map((f) => f.path));
  const shown = new Set([home]);
  const row = (name, dir, pinnable) => {
    const main = h('button', 'row-main');
    main.append(h('span', 'row-name', name), h('span', 'row-path', tilde(dir)));
    main.onclick = () => openFolder(dir);
    const wrap = h('div', 'row');
    wrap.append(main);
    if (!pinnable) return wrap;
    const on = pinnedPaths.has(dir);
    const star = h('button', `row-btn${on ? ' on' : ''}`, on ? '★' : '☆');
    star.setAttribute('aria-label', `${on ? 'Unpin' : 'Pin'} ${name}`);
    star.onclick = () => togglePin(dir, !on);
    wrap.append(star);
    return wrap;
  };
  // A folder can be pinned, recent and a project at once; list it once, in the first section it belongs to.
  const section = (label, list) => {
    const rows = list.filter((f) => !shown.has(f.path) && shown.add(f.path)).map((f) => row(f.name, f.path, true));
    return rows.length ? [h('p', 'sheet-label', label), ...rows] : [];
  };
  setSheet({
    title: 'New terminal',
    rows: [row('Home', home, false), ...section('Pinned', pinned), ...section('Recent', recent), ...section('Projects', projects)],
    form: otherPath,
    note: folderNote,
    error: true,
  });
}

$('new').addEventListener('click', openFolders);

const TEXT_LINES = 300;

// Wrapped rows are one logical line; joining them keeps long commands and URLs copyable in one piece.
function bufferText(term) {
  const buf = term.buffer.active;
  const lines = [];
  for (let i = 0; i < buf.length; i++) {
    const row = buf.getLine(i);
    const text = row.translateToString(!buf.getLine(i + 1)?.isWrapped);
    if (row.isWrapped && lines.length) lines[lines.length - 1] += text;
    else lines.push(text);
  }
  while (lines.length && !lines.at(-1)) lines.pop();
  return lines.slice(-TEXT_LINES).join('\n');
}

function openText() {
  const view = active();
  if (!view) return;
  showLayer('text');
  $('textTitle').textContent = `Last ${TEXT_LINES} lines`;
  $('textTitle').className = '';
  $('textPre').textContent = bufferText(view.term);
  $('textPre').scrollTop = $('textPre').scrollHeight;
}

// Plain http on the LAN is not a secure context, so navigator.clipboard is missing there; execCommand still works.
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {}
  }
  const area = h('textarea');
  area.value = text;
  area.readOnly = true;
  area.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(area);
  area.select();
  area.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  area.remove();
  return ok;
}

$('copyAll').addEventListener('click', async () => {
  const ok = await copyText($('textPre').textContent);
  $('textTitle').textContent = ok ? 'Copied' : 'Long-press to select';
  $('textTitle').className = ok ? 'ok' : 'error';
});
$('textClose').addEventListener('click', hideLayer);

let shortcuts = null;
let shortcutNote = '';
let editingShortcuts = false;
const addShortcut = sheetForm('Command, e.g. npm test', 'Add', (text, input) => {
  input.value = '';
  saveShortcuts([...shortcuts, text]);
});
addShortcut.querySelector('input').maxLength = 200;

async function openShortcuts() {
  shortcutNote = '';
  editingShortcuts = false;
  showLayer('shortcuts');
  try { shortcuts = await api('GET', '/api/shortcuts'); } catch (err) { shortcutNote = err.message; }
  if (layer === 'shortcuts') renderShortcuts();
}

async function saveShortcuts(next) {
  shortcutNote = '';
  try { shortcuts = await api('PUT', '/api/shortcuts', next); } catch (err) { shortcutNote = err.message; }
  renderShortcuts();
}

function runShortcut(text) {
  const view = active();
  if (!view) return;
  hideLayer();
  runCommand(view, text);
}

function renderShortcuts() {
  if (!shortcuts) return setSheet({ title: 'Shortcuts', note: shortcutNote || 'Loading…', error: !!shortcutNote });
  const toggle = h('button', 'sheet-act', editingShortcuts ? 'Done' : 'Edit');
  toggle.onclick = () => {
    editingShortcuts = !editingShortcuts;
    renderShortcuts();
  };
  const move = (i, by) => {
    const next = [...shortcuts];
    [next[i], next[i + by]] = [next[i + by], next[i]];
    saveShortcuts(next);
  };
  const iconButton = (label, aria, disabled, onClick) => {
    const b = h('button', 'row-btn', label);
    b.setAttribute('aria-label', aria);
    b.disabled = disabled;
    b.onclick = onClick;
    return b;
  };
  const rows = shortcuts.map((text, i) => {
    const row = h('div', `row${editingShortcuts ? ' editing' : ''}`);
    if (!editingShortcuts) {
      const run = h('button', 'row-main cmd', text);
      run.onclick = () => runShortcut(text);
      row.append(run);
      return row;
    }
    row.append(
      h('span', 'row-text', text),
      iconButton('↑', `Move ${text} up`, i === 0, () => move(i, -1)),
      iconButton('↓', `Move ${text} down`, i === shortcuts.length - 1, () => move(i, 1)),
      iconButton('✕', `Delete ${text}`, false, () => saveShortcuts(shortcuts.filter((_, j) => j !== i))),
    );
    return row;
  });
  setSheet({
    title: 'Shortcuts',
    action: toggle,
    rows,
    form: editingShortcuts && addShortcut,
    note: shortcutNote || (shortcuts.length ? '' : 'No shortcuts yet. Tap Edit to add one.'),
    error: !!shortcutNote,
  });
}

const UPLOAD_MAX = 25 * 1024 * 1024;

const shellQuote = (s) => (/^[\w@%+=:,./-]+$/.test(s) ? s : `'${s.replace(/'/g, `'\\''`)}'`);

function insertAtCursor(text) {
  const cmd = $('cmd');
  const start = cmd.selectionStart ?? cmd.value.length;
  const pad = start && !/\s/.test(cmd.value[start - 1]) ? ' ' : '';
  cmd.setRangeText(`${pad}${text} `, start, cmd.selectionEnd ?? start, 'end');
  cmd.scrollLeft = cmd.scrollWidth;
}

let statusTimer = 0;
function showStatus(text, error = false) {
  clearTimeout(statusTimer);
  $('uploadStatus').hidden = !text;
  $('uploadStatus').textContent = text;
  $('uploadStatus').classList.toggle('error', error);
  if (text && error) statusTimer = setTimeout(showStatus, 6000, '');
}
$('uploadStatus').addEventListener('click', () => showStatus(''));
keepFocus($('uploadStatus'));

function uploadFile(file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload');
    xhr.setRequestHeader('x-filename', encodeURIComponent(file.name));
    xhr.setRequestHeader('x-pocket-dev', '1');
    xhr.upload.onprogress = (e) => e.lengthComputable && onProgress(e.loaded / e.total);
    xhr.onload = () => {
      if (xhr.status === 401) location.replace('/login.html');
      let data = null;
      try { data = JSON.parse(xhr.responseText); } catch {}
      if (xhr.status === 201) resolve(data.path);
      else reject(new Error(data?.error || `HTTP ${xhr.status}`));
    };
    xhr.onerror = () => reject(new Error('cannot reach the Mac'));
    xhr.send(file);
  });
}

async function uploadFiles(files) {
  let failed = false;
  for (const file of files) {
    try {
      if (file.size > UPLOAD_MAX) throw new Error('larger than 25 MB');
      showStatus(`Uploading ${file.name}…`);
      const path = await uploadFile(file, (p) => showStatus(`Uploading ${file.name} ${Math.round(p * 100)}%`));
      insertAtCursor(shellQuote(path));
    } catch (err) {
      failed = true;
      showStatus(`${file.name}: ${err.message}`, true);
    }
  }
  if (!failed) showStatus('');
}

keepFocus($('attach'));
$('attach').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', () => {
  const files = [...$('file').files];
  $('file').value = '';
  uploadFiles(files);
});
$('cmd').addEventListener('paste', (e) => {
  const files = [...(e.clipboardData?.files ?? [])];
  if (!files.length) return;
  e.preventDefault();
  uploadFiles(files);
});

let forwards = [];
function renderForwards() {
  $('portsCount').textContent = forwards.length || '';
  $('chips').replaceChildren(...forwards.map(({ port, url, state, error }) => {
    const chip = h('span', 'chip');
    let link;
    if (state === 'open') {
      link = h('a', null, `:${port}`);
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener';
    } else {
      // The Mac changed networks: the forward waits for an address, or could not listen on the new one.
      link = h('button', `chip-off${error ? ' error' : ''}`, `:${port} ${error ? 'failed' : 'no network'}`);
      link.onclick = () => { $('portErr').textContent = error || 'The Mac has no network. The forward reopens when it gets one.'; };
    }
    const stop = h('button', null, '✕');
    stop.setAttribute('aria-label', `Stop forwarding ${port}`);
    stop.onclick = async () => {
      try { await api('DELETE', `/api/forwards/${port}`); } catch {}
      refreshForwards();
    };
    chip.append(link, stop);
    return chip;
  }));
}

async function refreshForwards() {
  forwards = (await api('GET', '/api/info')).forwards;
  renderForwards();
}

$('portsBtn').addEventListener('click', () => {
  $('ports').hidden = !$('ports').hidden;
  if (!$('ports').hidden) refreshForwards().catch(() => {});
  $('portsBtn').classList.toggle('open', !$('ports').hidden);
  scheduleFit();
});

$('portForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const port = Number($('portInput').value);
  $('portErr').textContent = '';
  try {
    await api('POST', '/api/forwards', { port });
    $('portInput').value = '';
  } catch (err) {
    $('portErr').textContent = err.message;
  }
  refreshForwards();
});

// git.js builds the Git view and listens for pd:view to load it the first time it is shown.
function setView(view) {
  $('app').dataset.view = view;
  store.set('pd.view', view);
  for (const b of $('viewSwitch').children) {
    b.classList.toggle('on', b.dataset.view === view);
    b.setAttribute('aria-pressed', String(b.dataset.view === view));
  }
  window.dispatchEvent(new CustomEvent('pd:view', { detail: view }));
  if (view !== 'terminal') return;
  // A socket that connected while the Git view was up never told the shell its size.
  requestAnimationFrame(() => {
    for (const v of views.values()) {
      fitView(v);
      sendMsg(v, { t: 'resize', cols: v.term.cols, rows: v.term.rows });
    }
    renderLatest();
  });
}
for (const b of $('viewSwitch').children) b.addEventListener('click', () => setView(b.dataset.view));
setView(store.get('pd.view') === 'git' ? 'git' : 'terminal');

const vv = window.visualViewport;
function onViewportChange() {
  if (vv) {
    $('app').style.height = `${vv.height}px`;
    $('app').style.transform = `translateY(${vv.offsetTop}px)`;
  }
  scheduleFit();
}
vv?.addEventListener('resize', onViewportChange);
vv?.addEventListener('scroll', onViewportChange);
window.addEventListener('orientationchange', onViewportChange);
new ResizeObserver(scheduleFit).observe($('terms'));

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  scheduleFit();
  for (const view of views.values()) {
    if (view.ws?.readyState === WebSocket.CLOSED) {
      clearTimeout(view.retry);
      reconnect(view);
    }
  }
  refreshForwards().catch(() => {});
});

window.pocketDev = { openSession: (s) => activate((views.get(s.id) ?? makeView(s)).id) };

(async () => {
  const stored = store.get('pd.active');
  await syncSessions();
  if (!views.size) await newSession();
  activate(views.has(stored) ? stored : activeId);
  refreshForwards().catch(() => {});
})();
</script>
