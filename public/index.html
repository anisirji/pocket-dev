<style>
  :root {
    --bg: #0b0e14; --panel: #131823; --panel-2: #1b2130; --line: #252d3c;
    --text: #d7dce5; --muted: #7d8799; --accent: #6aa9ff; --danger: #ff7b72;
    --mono: ui-monospace, "SF Mono", Menlo, "Roboto Mono", "Droid Sans Mono", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--text); font: 14px/1.3 system-ui, -apple-system, Roboto, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input { font: inherit; }

  #app { position: fixed; top: 0; left: 0; right: 0; height: 100dvh; display: flex; flex-direction: column; }

  /* Two rows at phone width: the views and the app-wide buttons, then the terminal tabs (Terminal view only). One row
     left the tabs about 50px at 360px. */
  header, #tabbar { flex: none; display: flex; align-items: center; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #tabbar { padding-top: 0; }
  #app.keyboard-open #tabbar { display: none; }
  #headGap { flex: 1; }
  #app:not([data-view="terminal"]) :is(#tabbar, #headGap) { display: none; }
  #tabs { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; display: flex; align-items: center; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
  .tab.active { border-color: var(--accent); background: var(--panel-2); }
  .tab.exited .tab-label { color: var(--muted); }
  .tab-label { height: 34px; padding: 0 2px 0 10px; max-width: 190px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab-x { width: 26px; height: 34px; color: var(--muted); font-size: 12px; }
  .icon-btn { flex: none; height: 36px; min-width: 36px; padding: 0 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
  .icon-btn.glyph { width: 36px; padding: 0; display: grid; place-items: center; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #new { font-size: 20px; line-height: 1; }
  .tabs-row { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); }
  .tabs-row.on { background: var(--panel-2); }
  .tabs-open { flex: 1; min-width: 0; display: grid; gap: 2px; padding: 10px 8px; text-align: left; }
  .tabs-open b { font-weight: 600; }
  .tabs-open small { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #portsBtn, #settingsBtn { position: relative; }
  #portsBtn.open { border-color: var(--accent); }
  #portsCount { position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: #08101e; font-size: 11px; font-weight: 600; line-height: 17px; text-align: center; }
  #portsCount:empty { display: none; }

  #ports { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 0; max-height: 25%; overflow-y: auto; overscroll-behavior: contain; padding: 6px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #ports[hidden] { display: none; }
  #portForm { display: flex; gap: 6px; }
  #portInput { width: 92px; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); outline: none; }
  #portInput:focus { border-color: var(--accent); }
  .primary { height: 34px; padding: 0 14px; border-radius: 8px; background: var(--accent); color: #08101e; font-weight: 600; }
  .chip { display: flex; align-items: center; border-radius: 17px; background: var(--panel-2); border: 1px solid var(--line); }
  .chip a { padding: 0 4px 0 12px; line-height: 32px; color: var(--accent); text-decoration: none; font-family: var(--mono); }
  .chip button { width: 30px; height: 32px; color: var(--muted); font-size: 12px; }
  .chip .chip-off { width: auto; height: auto; padding: 0 4px 0 12px; line-height: 32px; color: var(--muted); font-family: var(--mono); }
  .chip .chip-off.error { color: var(--danger); }
  #portErr { flex-basis: 100%; margin: 0; color: var(--danger); font-size: 13px; }
  #portErr:empty { display: none; }

  #terms { position: relative; flex: 1; min-height: 0; }
  .term { position: absolute; inset: 0; visibility: hidden; }
  .term.active { visibility: visible; }
  .term .xterm { height: 100%; padding: 4px 0 0 6px; }
  #latest { position: absolute; right: 14px; bottom: 12px; z-index: 5; height: 34px; padding: 0 14px; border-radius: 17px; background: var(--accent); color: #08101e; font-weight: 600; box-shadow: 0 2px 10px #0008; }
  #badge { position: absolute; top: 8px; right: 10px; z-index: 5; padding: 3px 9px; border-radius: 10px; background: #3a2a10; color: #f0c674; font-size: 12px; }
  #clientError { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
  #clientError p { flex: 1; min-width: 0; margin: 0; overflow-wrap: anywhere; }
  #clientReload { flex: none; }
  [hidden] { display: none !important; }

  #inputBar { flex: none; display: flex; gap: 6px; padding: 6px; border-top: 1px solid var(--line); background: var(--panel); }
  #cmd { flex: 1; min-width: 0; height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 16px; outline: none; }
  #cmd:focus { border-color: var(--accent); }
  #attach { flex: none; width: 42px; height: 42px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); font-size: 18px; }
  #attach:active { background: var(--line); }
  #uploadStatus { position: absolute; left: 10px; bottom: 12px; z-index: 5; max-width: calc(100% - 130px); padding: 8px 12px; border-radius: 17px; background: var(--panel-2); border: 1px solid var(--line); box-shadow: 0 2px 10px #0008; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #uploadStatus.error { color: var(--danger); white-space: normal; }
  #send { height: 42px; padding: 0 16px; border-radius: 10px; background: var(--accent); color: #08101e; font-weight: 600; }

  #keys { position: relative; flex: none; padding: 0 6px 4px; background: var(--panel); }
  #keyNav { display: flex; align-items: center; gap: 4px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; }
  #keyNav::-webkit-scrollbar { display: none; }
  #keyNav .key { min-width: 44px; padding: 0 10px; border-color: transparent; background: transparent; }
  #keyNav .key.arrow { width: 44px; padding: 0; }
  .key svg { display: block; width: 18px; height: 18px; margin: auto; }
  .key { flex: none; min-width: 52px; height: 44px; padding: 0 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); font-family: var(--mono); font-size: 13px; }
  .key:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .key:active, .icon-btn:active { background: var(--line); }

  .layer { position: absolute; inset: 0; z-index: 20; }
  #sheet { display: flex; flex-direction: column; justify-content: flex-end; background: #000a; }
  #sheetPanel { display: flex; flex-direction: column; max-height: 80%; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; background: var(--panel); }
  .layer-head { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 6px 8px 14px; }
  .layer-head h2 { flex: 1; margin: 0; font-size: 15px; font-weight: 600; }
  #sheetBody { min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 6px; }
  #sheetFoot { flex: none; padding: 0 6px 10px; }
  .sheet-label { margin: 12px 10px 2px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .row { display: flex; align-items: center; gap: 2px; }
  .row-main { flex: 1; min-width: 0; min-height: 48px; padding: 5px 10px; border-radius: 10px; text-align: left; }
  .row-main:active, .row-btn:active { background: var(--panel-2); }
  .row-name, .row-path { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-path { margin-top: 1px; color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .row-btn { flex: none; width: 42px; height: 42px; border-radius: 10px; color: var(--muted); font-size: 18px; }
  .row-btn.on { color: #f0c674; }
  .row-btn:disabled { opacity: .3; }
  .sheet-form { display: flex; gap: 6px; padding: 10px 4px 0; }
  .sheet-form input { flex: 1; min-width: 0; height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 16px; outline: none; }
  .sheet-form input:focus { border-color: var(--accent); }
  .sheet-form .primary { height: 42px; border-radius: 10px; }
  .sheet-note { margin: 10px 10px 0; color: var(--muted); font-size: 13px; }
  .sheet-note:empty { display: none; }
  .sheet-note.error { color: var(--danger); }
  .sheet-act { height: 36px; padding: 0 14px; border-radius: 8px; color: var(--accent); font-weight: 600; }
  .row-main.cmd, .row-text { font-family: var(--mono); font-size: 14px; }
  .row-text { flex: 1; min-width: 0; padding: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.editing { min-height: 48px; }
  #textView { display: flex; flex-direction: column; background: var(--bg); }
  #textView .layer-head { border-bottom: 1px solid var(--line); background: var(--panel); }
  #textTitle.ok { color: #7ee787; }
  #textTitle.error { color: #f0c674; }
  #textPre { flex: 1; min-height: 0; margin: 0; padding: 8px 10px 16px; overflow: auto; overscroll-behavior: contain; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
  .key.icon { min-width: 44px; padding: 0; font-family: inherit; font-size: 17px; }
</style>

<body>
<div id="app">
  <header>
    <div id="viewSwitch" role="group" aria-label="View">
      <button data-view="terminal" title="Terminal"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg><span class="sr-only">Terminal</span></button><button data-view="git" title="Git"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7"/><path d="M18 10.5c0 4-6 3.5-11 6"/></svg><span class="sr-only">Git</span></button><button data-view="chat" title="Chat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/></svg><span class="sr-only">Chat</span></button><button data-view="files" title="Files"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="sr-only">Files</span></button><button data-view="messages" title="Messages"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg><span class="sr-only">Messages</span></button>

<script>
const $ = (id) => document.getElementById(id);
const h = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
};

const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch {} },
};

// The one request helper for every page script: the server refuses changes without x-pocket-dev (see server.js).
async function api(method, url, body, { signal } = {}) {
  const res = await fetch(url, {
    method,
    signal,
    headers: { 'x-pocket-dev': '1', ...(body ? { 'content-type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  // The login page explains a blocked or not-yet-approved device instead of showing the form.
  if (res.status === 401 || data?.blocked || data?.pending) {
    location.replace('/login.html');
    throw new Error(data?.error || 'Not logged in');
  }
  if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);
  return data;
}

const views = new Map();
let activeId = null;
const active = () => views.get(activeId);

const THEME = {
  background: '#0b0e14', foreground: '#d7dce5', cursor: '#6aa9ff', selectionBackground: '#2a3550',
  black: '#1b2130', red: '#ff7b72', green: '#7ee787', yellow: '#f0c674', blue: '#6aa9ff', magenta: '#d2a8ff', cyan: '#76e3ea', white: '#d7dce5',
  brightBlack: '#5c6577', brightRed: '#ffa198', brightGreen: '#a5f0b0', brightYellow: '#f5d896', brightBlue: '#9cc6ff', brightMagenta: '#e2c5ff', brightCyan: '#a2eef2', brightWhite: '#ffffff',
};

function sendMsg(view, msg) {
  return view.connection?.send(msg) ?? false;
}
const sendInput = (view, d) => sendMsg(view, { t: 'in', d });
const phoneInput = matchMedia('(pointer: coarse)').matches;
const CLIENT_UPDATE_MESSAGE = 'Pocket Dev could not load its connection code. On the Mac, open Admin and press Restart Pocket Dev, then reload this page.';
function showClientError(message) {
  $('clientErrorText').textContent = message;
  $('clientError').hidden = false;
}
$('clientReload').addEventListener('click', () => location.reload());

function requireTerminalClient() {
  if (typeof window.PocketDevConnection !== 'function') throw new Error(CLIENT_UPDATE_MESSAGE);
  if (typeof Terminal !== 'function' || typeof window.FitAddon?.FitAddon !== 'function') {
    throw new Error('Pocket Dev could not load its terminal code. Reload this page. If it still fails, restart Pocket Dev from Admin on the Mac.');
  }
}
// The HTML is read from disk on every request, but a running server may predate
// newly added asset routes. Give both health entry points a useful failure state.
window.openHealthSheet = () => alert('Mac health has not loaded. Open Settings → This Mac → Update to load the latest server, then reload this page.');

function makeView(session) {
  requireTerminalClient();
  const el = h('div', 'term');
  $('terms').appendChild(el);
  const term = new Terminal({
    fontSize: 13, scrollback: 5000, cursorBlink: true, theme: THEME,
    fontFamily: getComputedStyle(document.documentElement).getPropertyValue('--mono'),
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(el);
  // Android keyboards edit composed words, which a terminal cannot reliably apply
  // one character at a time. Keep phone typing in the visible command field.
  if (phoneInput && term.textarea) {
    term.textarea.readOnly = true;
    term.textarea.inputMode = 'none';
    term.textarea.tabIndex = -1;
    term.textarea.addEventListener('focus', () => $('cmd').focus({ preventScroll: true }));
  }
  const view = { id: session.id, title: session.title, exitCode: session.exitCode, cwd: session.cwd, startedAt: session.startedAt, activeAt: session.activeAt, term, fit, el, ws: null, online: false, everOnline: false, retry: 0, closed: false };
  term.onData((d) => sendInput(view, d));
  term.onResize(({ cols, rows }) => sendMsg(view, { t: 'resize', cols, rows }));
  term.onScroll(() => view.id === activeId && renderLatest());
  term.onWriteParsed(() => view.id === activeId && renderLatest());
  attachTouchScroll(view);
  views.set(view.id, view);
  fitView(view);
  connect(view);
  return view;
}

function connect(view) {
  view.connection = new window.PocketDevConnection({
    url: () => `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/${view.id}`,
    beforeConnect: async (signal) => {
      if (view.everOnline) await syncSessions(signal);
      return !view.closed;
    },
    onOpen(ws) {
      view.ws = ws;
      view.term.reset();
      if (terminalShown() && view.id === activeId) sendMsg(view, { t: 'resize', cols: view.term.cols, rows: view.term.rows });
    },
    onState(state) {
      view.online = state === 'connected';
      if (view.online) view.everOnline = true;
      renderBadge();
      window.pocketDevNetwork?.socket(view.online);
    },
    onMessage(msg) {
      if (msg.t === 'out') {
        view.activeAt = Date.now();
        view.term.write(msg.d);
      }
      else if (msg.t === 'exit') {
        view.exitCode = msg.code;
        view.term.write(`\r\n\x1b[2m[process exited ${msg.code}]\x1b[0m\r\n`);
        renderTabs();
      } else if (msg.t === 'waiting') window.pocketDevSettings?.waiting(msg);
    },
    onClose(e) {
      if (POWER_REASONS.has(e.reason)) { showPower(e.reason); return false; }
      return !powerPaused;
    },
  });
}

function dropView(view) {
  view.closed = true;
  view.connection?.dispose();
  view.term.dispose();
  view.el.remove();
  views.delete(view.id);
}

async function syncSessions(signal) {
  const list = await api('GET', '/api/sessions', undefined, { signal });
  const ids = new Set(list.map((s) => s.id));
  for (const view of [...views.values()]) if (!ids.has(view.id)) dropView(view);
  for (const s of list) {
    const view = views.get(s.id);
    if (view) Object.assign(view, { exitCode: s.exitCode ?? view.exitCode, activeAt: Math.max(view.activeAt ?? 0, s.activeAt ?? 0) });
    else makeView(s);
  }
  if (!views.has(activeId) && views.size) activate(views.keys().next().value);
  renderTabs();
}

async function newSession(cwd) {
  const s = await api('POST', '/api/sessions', cwd ? { cwd } : {});

async function closeSession(view) {
  if (!confirm(`Close ${view.title}? Anything running in it will be killed.`)) return;
  try { await api('DELETE', `/api/sessions/${view.id}`); } catch {}
  const wasActive = view.id === activeId;
  dropView(view);
  if (!views.size) return newSession();
  if (wasActive) activate(views.keys().next().value);
  else renderTabs();
}

function activate(id) {
  if (activeId !== id) {
    saveCommandDraft();
    try { $('cmd').value = sessionStorage.getItem(`pd.terminal.draft.${id}`) || ''; } catch { $('cmd').value = ''; }
  }
  activeId = id;
  store.set('pd.active', id);
  for (const v of views.values()) v.el.classList.toggle('active', v.id === id);
  renderTabs();
  renderBadge();
  renderLatest();
  const view = active();
  if (view) fitView(view);
  $('tabs').querySelector('.tab.active')?.scrollIntoView({ inline: 'nearest', block: 'nearest' });
}
function saveCommandDraft() {
  if (!activeId) return;
  try {
    const key = `pd.terminal.draft.${activeId}`;

// Every terminal in one list: where it is, whether it still runs, and when it last printed something.
function ago(ms) {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 10) return 'just now';
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return `${Math.floor(s / 86400)} d ago`;
}

// xterm 5's own touch scrolling is unreliable on Android, so drive scrollLines from touch deltas with a small fling.
function attachTouchScroll(view) {
  let lastY = 0, lastT = 0, velocity = 0, carry = 0, dragging = false, frame = 0;
  const rowPx = () => (view.el.querySelector('.xterm-screen')?.clientHeight || 0) / view.term.rows || 16;
  const scrollPx = (dy) => {
    carry += dy;
    const lines = Math.trunc(carry / rowPx());
    if (lines) {
      view.term.scrollLines(lines);
      carry -= lines * rowPx();
    }
  };
  view.el.addEventListener('touchstart', (e) => {
    cancelAnimationFrame(frame);
    if (e.touches.length !== 1) return;
    // Run before xterm's touch handlers, which can otherwise consume this event
    // and leave our first scroll delta measured from a previous gesture.
    e.stopPropagation();
    lastY = e.touches[0].clientY;
    lastT = e.timeStamp;
    velocity = carry = 0;
    dragging = false;
  }, { passive: true, capture: true });
  view.el.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 1) return;
    const y = e.touches[0].clientY;
    const dy = lastY - y;
    if (!dragging && Math.abs(dy) < 6) return;
    dragging = true;
    e.preventDefault();
    e.stopPropagation();
    velocity = dy / Math.max(1, e.timeStamp - lastT);
    lastY = y;
    lastT = e.timeStamp;
    scrollPx(dy);
  }, { passive: false, capture: true });
  view.el.addEventListener('touchend', (e) => {
    if (dragging || phoneInput) {
      e.preventDefault();
      e.stopPropagation();
    }
    if (!dragging && phoneInput) $('cmd').focus({ preventScroll: true });
    if (!dragging || e.timeStamp - lastT > 100) return;
    let perFrame = velocity * 16;
    const step = () => {
      perFrame *= 0.95;
      if (Math.abs(perFrame) < 0.5) return;
      scrollPx(perFrame);
      frame = requestAnimationFrame(step);
    };
    frame = requestAnimationFrame(step);
  }, { passive: false, capture: true });
  view.el.addEventListener('touchcancel', () => {
    cancelAnimationFrame(frame);
    dragging = false;
    velocity = carry = 0;
  }, { passive: true, capture: true });
}

// One row that scrolls sideways: Ctrl+C first, then the keys a Codex or Claude prompt needs most, then the rest.
const KEYS = [
  ['Ctrl+C', '\x03'],
  ['Answer', '\x1b[1;2D', 'Answer Codex question (Shift+Left)'],
  ['↑', 'A', 'Up'], ['↓', 'B', 'Down'], ['Enter', '\r'],
  ['Esc', '\x1b'], ['Tab', '\t'], ['Shift+Tab', '\x1b[Z'],
  ['←', 'D', 'Left'], ['→', 'C', 'Right'], ['Ctrl+D', '\x04'],
];
const ARROWS = 'ABCD';
const ARROW_PATHS = { A: 'm6 14 6-6 6 6', B: 'm6 10 6 6 6-6', D: 'm14 6-6 6 6 6', C: 'm10 6 6 6-6 6' };

const closeKeyboard = () => document.activeElement?.blur();

// Buttons that take focus would close the phone keyboard, so swallow the press and act on click.
function keepFocus(button) {
  button.tabIndex = -1;
  button.addEventListener('pointerdown', (e) => e.preventDefault());
  button.addEventListener('mousedown', (e) => e.preventDefault());
}

function iconKey(label, ariaLabel, onClick) {
  const key = h('button', 'key', label);
  key.setAttribute('aria-label', ariaLabel);

  key.onclick = onClick;
  $('keyNav').appendChild(key);
}

function terminalKey([label, seq, description = label]) {
  const key = h('button', 'key', label);
  key.setAttribute('aria-label', description);
  key.title = description;
  if (ARROW_PATHS[seq]) {
    key.classList.add('arrow');
    key.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ARROW_PATHS[seq]}"/></svg>`;
  }
  keepFocus(key);
  key.removeAttribute('tabindex');
  key.onclick = () => {
    const view = active();
    if (!view) return;
    if (!view.online || view.ws?.readyState !== WebSocket.OPEN) {
      showStatus('Terminal is reconnecting. Your key has not been sent.', true);
      return;
    }
    // Match what xterm sends for a real arrow key: SS3 form when the app enabled application cursor mode.
    // Modified arrows (Answer is Shift+Left) always use CSI with the modifier parameter.
    const data = ARROWS.includes(seq) ? (view.term.modes.applicationCursorKeysMode ? '\x1bO' : '\x1b[') + seq : seq;
    view.term.scrollToBottom();
    sendInput(view, data);
    if (seq === '\r') closeKeyboard();
  };
  $('keyNav').appendChild(key);
}
KEYS.forEach(terminalKey);

iconKey('Copy', 'Copy output', () => openText());

function runCommand(view, text) {
  if (!view.online || view.ws?.readyState !== WebSocket.OPEN) {
    showStatus('Terminal is reconnecting. Your command has not been sent.', true);
    return false;
  }
  if (text) {
    const socket = view.connection.socket;
    if (!sendInput(view, text)) return false;
    // A TUI that detects pastes by chunk can read text+CR arriving together as a pasted newline, not a submit.
    setTimeout(() => {
      if (view.connection.socket === socket && view.online) sendInput(view, '\r');
      else showStatus('Connection changed before Enter was sent. Check the terminal before retrying.', true);
    }, 30);
  } else {
    if (!sendInput(view, '\r')) return false;
  }
  view.term.scrollToBottom();
  closeKeyboard();
  return true;
}

// Every overlay (the folder and shortcut sheets, the copy view, Resume and its detail, Settings, Open apps and its
// detail) is one level of this stack and owns one history entry, so Android's back gesture closes only the topmost
// one. history.back() lands later, in a popstate; history calls run one at a time so an overlay opened before that
// popstate is not closed by it.
const overlays = (() => {
  const PAGE = Math.random().toString(36).slice(2);
  const stack = [];
  let queue = Promise.resolve();
  let ownPop = null;
  const run = (step) => { queue = queue.then(step); };
  window.addEventListener('popstate', (e) => {
    if (ownPop) return ownPop();
    // Entries left by an earlier load of the page (a reload with an overlay open) count as depth 0.
    const depth = e.state?.pdPage === PAGE ? e.state.pdOverlay : 0;
    while (stack.length > depth) stack.pop().onClose();
  });
  return {
    open(name, onClose) {
      stack.push({ name, onClose });
      const depth = stack.length;
      run(() => history.pushState({ pdPage: PAGE, pdOverlay: depth }, ''));
    },
    // Closes `name` and every overlay opened above it.
    close(name) {
      const i = stack.findLastIndex((o) => o.name === name);
      if (i === -1) return;
      const closed = stack.splice(i);
      for (const o of closed.reverse()) o.onClose();
      run(() => new Promise((resolve) => {
        const done = () => { clearTimeout(timer); ownPop = null; resolve(); };
        const timer = setTimeout(done, 1000);
        ownPop = done;
        history.go(-closed.length);
      }));
    },
    closeAll() {
      if (stack.length) this.close(stack[0].name);
    },
  };
})();

const TEXT_LINES = 300;

// Wrapped rows are one logical line; joining them keeps long commands and URLs copyable in one piece.
function bufferText(term) {
  const buf = term.buffer.active;
  const lines = [];
  for (let i = 0; i < buf.length; i++) {
    const row = buf.getLine(i);
    const text = row.translateToString(!buf.getLine(i + 1)?.isWrapped);
    if (row.isWrapped && lines.length) lines[lines.length - 1] += text;
    else lines.push(text);
  }
  while (lines.length && !lines.at(-1)) lines.pop();
  return lines.slice(-TEXT_LINES).join('\n');
}

function openText() {
  const view = active();
  if (!view) return;
  showLayer('text');
  $('textTitle').textContent = `Last ${TEXT_LINES} lines`;
  $('textTitle').className = '';
  $('textPre').textContent = bufferText(view.term);
  $('textPre').scrollTop = $('textPre').scrollHeight;
}

// Plain http on the LAN is not a secure context, so navigator.clipboard is missing there; execCommand still works.
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {}
  }
  const area = h('textarea');
  area.value = text;
  area.readOnly = true;
  area.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(area);
  area.select();
  area.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  area.remove();
  return ok;
}

$('copyAll').addEventListener('click', async () => {

// Edits run one at a time, each applied to the list the server returned last, so quick taps never undo each other.
let shortcutSaves = Promise.resolve();
function saveShortcuts(change) {
  shortcutSaves = shortcutSaves.then(async () => {
    shortcutNote = '';
    try {
      shortcuts = await api('PUT', '/api/shortcuts', change(shortcuts));
      return true;
    } catch (err) {
      shortcutNote = err.message;
      return false;
    } finally {
      if (layer === 'shortcuts') renderShortcuts();
    }
  });
  return shortcutSaves;
}
// A row's index can shift while earlier edits are saving; find the command again in the current list.
const findShortcut = (list, i, text) => (list[i] === text ? i : list.indexOf(text));

function runShortcut(text) {
  const view = active();
  if (!view) return;
  hideLayer();
  runCommand(view, text);
}

function renderShortcuts() {
  if (!shortcuts) return setSheet({ title: 'Shortcuts', note: shortcutNote || 'Loading…', error: !!shortcutNote });
  const toggle = h('button', 'sheet-act', editingShortcuts ? 'Done' : 'Edit');
  toggle.onclick = () => {
    editingShortcuts = !editingShortcuts;
    renderShortcuts();
  };
  const move = (i, text, by) => saveShortcuts((list) => {
    const from = findShortcut(list, i, text);
    const to = from + by;
    if (from === -1 || to < 0 || to >= list.length) return list;
    const next = [...list];
    [next[from], next[to]] = [next[to], next[from]];
    return next;
  });
  const remove = (i, text) => saveShortcuts((list) => list.filter((_, j) => j !== findShortcut(list, i, text)));
  const iconButton = (label, aria, disabled, onClick) => {
    const b = h('button', 'row-btn', label);
    b.setAttribute('aria-label', aria);
    b.disabled = disabled;
    b.onclick = onClick;
    return b;
  };
  const rows = shortcuts.map((text, i) => {
    const row = h('div', `row${editingShortcuts ? ' editing' : ''}`);
    if (!editingShortcuts) {
      const run = h('button', 'row-main cmd', text);
      run.onclick = () => runShortcut(text);
      row.append(run);
      return row;
    }
    row.append(
      h('span', 'row-text', text),
      iconButton('↑', `Move ${text} up`, i === 0, () => move(i, text, -1)),
      iconButton('↓', `Move ${text} down`, i === shortcuts.length - 1, () => move(i, text, 1)),
      iconButton('✕', `Delete ${text}`, false, () => remove(i, text)),
    );
    return row;
  });
  setSheet({
    title: 'Shortcuts',
    action: toggle,
    rows,
    form: editingShortcuts && addShortcut,
    note: shortcutNote || (shortcuts.length ? '' : 'No shortcuts yet. Tap Edit to add one.'),
    error: !!shortcutNote,
  });
}

function uploadFile(file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload');
    xhr.setRequestHeader('x-filename', encodeURIComponent(file.name));
    xhr.setRequestHeader('x-pocket-dev', '1');
    xhr.upload.onprogress = (e) => e.lengthComputable && onProgress(e.loaded / e.total);
    xhr.onload = () => {
      if (xhr.status === 401) location.replace('/login.html');
      let data = null;
      try { data = JSON.parse(xhr.responseText); } catch {}
      if (xhr.status === 201) resolve(data.path);
      else reject(new Error(data?.error || `HTTP ${xhr.status}`));
    };
    xhr.onerror = () => reject(new Error('cannot reach the Mac'));
    xhr.send(file);
  });
}

async function uploadFiles(files) {
  let failed = false;
  for (const file of files) {
    try {
      if (file.size > UPLOAD_MAX) throw new Error('larger than 25 MB');
      showStatus(`Uploading ${file.name}…`);
      const path = await uploadFile(file, (p) => showStatus(`Uploading ${file.name} ${Math.round(p * 100)}%`));
      insertAtCursor(shellQuote(path));
    } catch (err) {
      failed = true;
      showStatus(`${file.name}: ${err.message}`, true);
    }
  }
  if (!failed) showStatus('');
}

keepFocus($('attach'));
$('attach').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', () => {
  const files = [...$('file').files];
  $('file').value = '';
  uploadFiles(files);
});
$('cmd').addEventListener('paste', (e) => {
  const files = [...(e.clipboardData?.files ?? [])];
  if (!files.length) return;
  e.preventDefault();
  uploadFiles(files);
});

let forwards = [];
function renderForwards() {
  $('portsCount').textContent = forwards.length || '';
  $('chips').replaceChildren(...forwards.map(({ port, url, state, error }) => {
    const chip = h('span', 'chip');
    let link;
    if (state === 'open') {
      link = h('a', null, `:${port}`);
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener';
    } else {
      // The Mac changed networks: the forward waits for an address, or could not listen on the new one.
      link = h('button', `chip-off${error ? ' error' : ''}`, `:${port} ${error ? 'failed' : 'no network'}`);
      link.onclick = () => { $('portErr').textContent = error || 'The Mac has no network. The forward reopens when it gets one.'; };
    }
    const stop = h('button', null, '✕');
    stop.setAttribute('aria-label', `Stop forwarding ${port}`);
    stop.onclick = async () => {
      try { await api('DELETE', `/api/forwards/${port}`); } catch {}
      refreshForwards();
    };
    chip.append(link, stop);
    return chip;
  }));
}

async function refreshForwards() {
  forwards = (await api('GET', '/api/info')).forwards;
  renderForwards();
}

$('portsBtn').addEventListener('click', () => {
  $('ports').hidden = !$('ports').hidden;
  if (!$('ports').hidden) refreshForwards().catch(() => {});
  $('portsBtn').classList.toggle('open', !$('ports').hidden);
  scheduleFit();
});

$('portForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const port = Number($('portInput').value);
  $('portErr').textContent = '';
  try {
    await api('POST', '/api/forwards', { port });
    $('portInput').value = '';
  } catch (err) {
    $('portErr').textContent = err.message;
  }
  refreshForwards();
});

// git.js builds the Git view and listens for pd:view to load it the first time it is shown.
function setView(view) {
  $('app').dataset.view = view;
  store.set('pd.view', view);
  for (const b of $('viewSwitch').children) {
    b.classList.toggle('on', b.dataset.view === view);
    b.setAttribute('aria-pressed', String(b.dataset.view === view));
  }
  window.dispatchEvent(new CustomEvent('pd:view', { detail: view }));
  if (view !== 'terminal') return;
  // A socket that connected while the Git view was up never told the shell its size.
  requestAnimationFrame(() => {
    for (const v of views.values()) {
      fitView(v);
      sendMsg(v, { t: 'resize', cols: v.term.cols, rows: v.term.rows });
    }
    renderLatest();
  });
}
// Chat and Files are full-screen screens over the current view, with their own back and close; Terminal and Git
// switch in place.
const SCREENS = { chat: () => window.pocketDevChat.open(), files: () => window.openFiles(), messages: () => window.pocketDevMessages?.open() };
for (const b of $('viewSwitch').children) {
  b.addEventListener('click', () => (SCREENS[b.dataset.view] ? SCREENS[b.dataset.view]() : setView(b.dataset.view)));
}
setView(store.get('pd.view') === 'git' ? 'git' : 'terminal');

const vv = window.visualViewport;
let restingViewportHeight = vv?.height ?? innerHeight;
function onViewportChange() {
  const viewportHeight = vv?.height ?? innerHeight;
  const typing = document.activeElement === $('cmd');
  if (!typing) restingViewportHeight = viewportHeight;
  $('app').classList.toggle('keyboard-open', phoneInput && typing && restingViewportHeight - viewportHeight > 120);
  scheduleFit();
}
vv?.addEventListener('resize', onViewportChange);
vv?.addEventListener('scroll', onViewportChange);
$('cmd').addEventListener('focus', onViewportChange);
$('cmd').addEventListener('blur', onViewportChange);
window.addEventListener('orientationchange', onViewportChange);
window.addEventListener('resize', onViewportChange);
new ResizeObserver(scheduleFit).observe($('terms'));

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { saveCommandDraft(); return; }
  scheduleFit();
  refreshForwards().catch(() => {});
});

function reconnectClosed() {
  for (const view of views.values()) {
    view.connection?.resume();
  }
}

// Before the Mac sleeps or shuts down the server closes every socket with one of these reasons. The power screen
// then polls slowly on its own, so the 2 s reconnects stop until it hands back (onBack).
const POWER_REASONS = new Set(['mac-sleeping', 'mac-shutting-down']);
const power = import('/power.js');
let powerPaused = false;

// Anything that needs sudo runs here, so macOS asks for the password in that terminal and the server never sees it.
async function runInTerminal(command, cwd) {
  const s = await api('POST', '/api/sessions', { cwd, command });
  overlays.closeAll();
  window.pocketDev.openSession(s);
}

const powerOptions = {
  runInTerminal,
  openApps: () => window.openAppsSheet(),
  async onBack() {
    powerPaused = false;
    try { await syncSessions(); } catch {}
    if (!views.size) await newSession().catch(() => {});
    reconnectClosed();
  },
};

async function showPower(reason) {
  powerPaused = true;
  (await power).showPowerScreen(reason, api, powerOptions);
}

power.then((m) => m.renderGearBattery($('gearBattery'), api));

window.pocketDev = {
  overlays,
  power,
  powerOptions,
  showClientError,
  clientUpdateMessage: CLIENT_UPDATE_MESSAGE,
  // Resume continues a conversation from either view; the new terminal has to be on screen.
  openSession(s) {
    setView('terminal');
    activate((views.get(s.id) ?? makeView(s)).id);
  },
  // Files' "Open terminal here".
  async openTerminalAt(dir) {
    window.pocketDev.openSession(await api('POST', '/api/sessions', { cwd: dir }));
  },
  activeSession: () => activeId,
};

(async () => {
  requireTerminalClient();
  // A switch between the Mac's addresses names the terminal to reopen in the fragment; it is read once and dropped.
  const handedOff = /^#terminal=([0-9a-f]+)$/.exec(location.hash)?.[1];
  if (handedOff) history.replaceState(history.state, '', location.pathname + location.search);
  const stored = handedOff ?? store.get('pd.active');
  await syncSessions();
  if (!views.size) await newSession();
  activate(views.has(stored) ? stored : activeId);
  refreshForwards().catch(() => {});
})().catch((err) => showClientError(`Could not open terminals: ${err.message}`));
</script>
