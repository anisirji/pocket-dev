<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0e14">
<title>Pocket Dev</title>
<style>
  :root { --bg: #0b0e14; --panel: #131823; --line: #252d3c; --text: #d7dce5; --muted: #7d8799; --accent: #6aa9ff; --danger: #ff7b72; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, Roboto, sans-serif; }
  body { display: grid; place-items: center; padding: 16px; }
  form { width: 100%; max-width: 340px; display: grid; gap: 12px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  h1 span { color: var(--muted); font-weight: 400; }
  input, button { font: inherit; height: 48px; border-radius: 10px; border: 1px solid var(--line); }
  input { background: var(--panel); color: var(--text); padding: 0 14px; outline: none; }
  input:focus { border-color: var(--accent); }
  button { background: var(--accent); color: #08101e; font-weight: 600; border: 0; }
  button:disabled { opacity: .6; }
  #err { color: var(--danger); min-height: 1.4em; margin: 0; font-size: 14px; }
</style>
</head>
<body>
<form id="f">
  <h1>Pocket Dev <span>login</span></h1>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus required>
  <button id="go">Log in</button>
  <p id="err"></p>
</form>
<script>
  const f = document.getElementById('f');
  const go = document.getElementById('go');
  const err = document.getElementById('err');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    go.disabled = true;
    err.textContent = '';
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value }),
      });
      if (r.ok) return location.replace('/');
      err.textContent = r.status === 401 ? 'Wrong password' : `Login failed (${r.status})`;
    } catch {
      err.textContent = 'Cannot reach the Mac';
    } finally {
      go.disabled = false;
    }
  });
</script>
</body>
</html>
