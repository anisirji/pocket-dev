name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: dropdown
    id: os
    attributes: { label: Operating system, options: [Windows, macOS, Linux] }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: "Output of `pocket-dev --version` and `node -v`" }
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes: { label: "Output of `pocket-dev doctor`", render: text }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What you did, and what you expected instead }
    validations: { required: true }
