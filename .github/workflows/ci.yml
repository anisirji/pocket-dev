name: Pocket Dev checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    name: macOS tests and responsive UI
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run complete test suite
        run: npm test
      - name: Install browser check dependencies
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
      - name: Check phone, tablet and desktop layouts
        run: node scripts/check-responsive.mjs
