name: Pocket Dev checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    name: macOS complete test suite
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run complete test suite
        run: node --test --test-concurrency=2 test/*.test.mjs

  macos-browser:
    name: macOS responsive UI and browser flows
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser check dependencies
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
          node --input-type=module -e 'import {chromium} from "playwright"; console.log("CHROME_PATH=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Check phone, tablet and desktop layouts
        run: node test/browser/check-responsive.mjs
      - name: Check camera viewer and computer browser capture
        run: |
          node test/browser/check-camera.mjs
          node test/browser/check-camera-host.mjs
          node test/browser/check-camera-audio.mjs
          node test/browser/check-hold-to-speak.mjs
          node test/browser/check-screen.mjs
          node test/browser/check-screen-control.mjs
      - name: Check project workspace and editor
        run: |
          node test/browser/check-workspace.mjs
          node test/browser/check-workspace-persistence.mjs
          node test/browser/check-workspace-git.mjs
      - name: Check shared folder dialogs and computer routing
        run: node test/browser/check-folder-picker.mjs
      - name: Check native Settings navigation and lifecycle
        run: |
          node test/browser/check-settings.mjs
          node test/browser/check-navigation-refresh.mjs
          node test/browser/check-power-actions.mjs
      - name: Check personal browser consent and notifications
        run: |
          node test/browser/check-codex-browser.mjs
          node test/browser/check-notifications.mjs
          node test/browser/check-guides.mjs
          node test/browser/check-setup.mjs
          node test/browser/check-connection-qr.mjs
          node test/browser/check-monitored-command.mjs
      - name: Check connected computers and provider switching
        run: |
          node test/browser/check-connections.mjs
          node test/browser/check-engine-dropdown.mjs

  windows-updater:
    name: Windows connections, Settings, AI isolation and updater
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test generated PowerShell and the Windows update handoff
        run: node --test test/windows-update.test.mjs test/windows-update-runtime.test.mjs
      - name: Test connections, workspace permissions and Codex launching
        run: node --test test/codex-windows-launch.test.mjs test/connections-unit.test.mjs test/remote-codex.test.mjs test/remote-handshake.test.mjs test/workspace-leases.test.mjs test/static-assets.test.mjs test/room.test.mjs test/room-invite.test.mjs
      - name: Test workspace state, folder picker and native filesystem notifications
        run: node --test test/workspace-core.test.mjs test/folder-picker-ui.test.mjs test/workspace-watch-native.test.mjs
      - name: Test Windows Codex transport, camera lifecycle, notifications and ZIP downloads
        run: node --test test/codex-rpc.test.mjs test/browser-camera.test.mjs test/notifications.test.mjs test/files-zip-windows.test.mjs test/connection-qr.test.mjs
      - name: Test background browser launch requests
        run: node --test --test-name-pattern="background URL" test/platform.test.mjs
      - name: Check Settings in native Windows Edge
        shell: pwsh
        run: |
          $settingsResult = Join-Path $env:RUNNER_TEMP "pocket-settings-windows.json"
          node test/native/check-settings-windows.mjs (Get-Location).Path $settingsResult
          $settingsExit = $LASTEXITCODE
          Get-Content -LiteralPath $settingsResult
          exit $settingsExit
